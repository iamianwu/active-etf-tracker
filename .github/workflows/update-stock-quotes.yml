name: Update Stock Quotes

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一到週五 09:00-13:45，每 15 分鐘補一次股價
    - cron: "*/15 1-5 * * 1-5"
    # 台灣時間 14:10 收盤後補一次
    - cron: "10 6 * * 1-5"

jobs:
  update-stock-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update stock quotes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QUOTE_BATCH_SIZE: "80"
          QUOTE_SLEEP_SEC: "0.15"
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python -m app.jobs.update_stock_quotes
