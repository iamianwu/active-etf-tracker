name: Update Institutional Trading

on:
  workflow_dispatch:

jobs:
  update-institutional-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update institutional trading
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INSTITUTIONAL_LOOKBACK_DAYS: "10"
          REQUEST_TIMEOUT: "90"
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python -m app.jobs.update_institutional_trading
