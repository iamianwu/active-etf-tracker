name: Update Yahoo All Quotes Slow

on:
  workflow_dispatch:
    inputs:
      batch_codes:
        description: "每一大批幾檔股票。建議 40，較不容易被 Yahoo 429。"
        required: false
        default: "40"

jobs:
  batch-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Update Yahoo quotes slow batch 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YAHOO_PRIORITY_MAX_CODES: ${{ github.event.inputs.batch_codes || '40' }}
          YAHOO_PRIORITY_OFFSET: "0"
          YAHOO_BATCH_SIZE: "3"
          YAHOO_SLEEP_SEC: "12.0"
          YAHOO_MAX_RETRIES: "3"
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python -m app.jobs.update_yahoo_priority_quotes

  batch-2:
