name: Warm Signals Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "58 10 * * 1-5"

concurrency:
  group: signals-cache-writes
  cancel-in-progress: false

jobs:
  warm-signals-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Warm signals cache from API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: https://active-etf-tracker.vercel.app
          SIGNAL_UNIVERSES: active,reference,all
          SIGNAL_DAYS: 1,5,10,20
          SIGNALS_CACHE_SLEEP_SEC: "0.5"
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python -m app.jobs.warm_signals_cache_from_api
