name: Warm Signals Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "58 10 * * 1-5"

concurrency:
  group: signals-cache-writes
  cancel-in-progress: false

jobs:
  warm-signals-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init signals cache table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python -m app.jobs.init_signals_cache

      - name: Warm signals cache and CDN
        env:
          SITE_URL: https://active-etf-tracker.vercel.app
        run: |
          for d in 1 5 10 20; do
            echo "rebuilding days=$d"
            curl -fsS "$SITE_URL/api/signals?days=$d&fresh=1" > /dev/null

            VERSION=$(curl -fsS "$SITE_URL/api/signals-version?days=$d" | python -c "import sys,json; print(json.load(sys.stdin).get('version','none'))")
            echo "warming cdn days=$d version=$VERSION"
            curl -fsS "$SITE_URL/api/signals?days=$d&cv=$VERSION" > /dev/null
            curl -fsS "$SITE_URL/api/signals?days=$d&cv=$VERSION" > /dev/null
          done
