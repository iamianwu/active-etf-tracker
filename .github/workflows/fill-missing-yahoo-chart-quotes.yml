name: Fill Missing Yahoo Chart Quotes

on:
  workflow_dispatch:
    inputs:
      max_codes:
        description: "每一輪補幾檔缺股價股票。建議 50。"
        required: false
        default: "50"

jobs:
  pass-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fill missing quotes pass 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YAHOO_MISSING_MAX_CODES: ${{ github.event.inputs.max_codes || '50' }}
          YAHOO_MISSING_SLEEP_SEC: "3.5"
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python -m app.jobs.fill_missing_yahoo_chart_quotes

