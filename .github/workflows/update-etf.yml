name: Update ETF Data

on:
  # GitHub cron uses UTC. 10:10 UTC = 18:10 Taiwan time.
  schedule:
    - cron: "10 10 * * 1-5"
  workflow_dispatch:
    inputs:
      dt_range:
        description: "Pocket DTRange. 1=latest, 90=history backfill"
        required: false
        default: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update ETF data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DT_RANGE: ${{ github.event.inputs.dt_range || '1' }}
          SLEEP_SEC: "0.8"
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python - <<'PY2'
import os
from pprint import pprint
from app.services.fetcher import update_all_etfs

dt_range = int(os.environ.get("DT_RANGE", "1"))
sleep_sec = float(os.environ.get("SLEEP_SEC", "0.8"))

print(f"Run active ETF holdings only: dt_range={dt_range}, sleep_sec={sleep_sec}", flush=True)
pprint(update_all_etfs(dt_range=dt_range, sleep_sec=sleep_sec))
PY2
