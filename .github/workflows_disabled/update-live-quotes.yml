name: Update Live Quotes

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 09:00-12:55，每 5 分鐘
    - cron: "*/5 1-4 * * 1-5"
    # 台灣時間 13:00-13:30，每 5 分鐘
    - cron: "0-30/5 5 * * 1-5"

jobs:
  update-live-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update live quotes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd backend
          python -m app.jobs.update_quotes
